name: Fahrdienst live diagnostics

on:
  push:
    branches: [diagnostics-live-status-20260929]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are present
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          FAHRDIENST_SMTP_PASSWORD: ${{ secrets.FAHRDIENST_SMTP_PASSWORD }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          set -e
          test -n "$GOOGLE_PLACES_API_KEY"
          test -n "$FAHRDIENST_SMTP_PASSWORD"
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_SSH_PRIVATE_KEY"
          echo "Required secrets are present."

      - name: Check public website and API health
        run: |
          set -e
          curl -fsS --retry 3 https://tariq-fahrdienst.de/ >/dev/null
          curl -fsS --retry 3 https://tariq-fahrdienst.de/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"placesConfigured":true' /tmp/health.json
          grep -q '"mailConfigured":true' /tmp/health.json
          echo "Website and API health are OK."
