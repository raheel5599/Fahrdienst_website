name: Fahrdienst live diagnostics

on:
  push:
    branches: [diagnostics-live-status-20260929]

jobs:
  google-secret:
    runs-on: ubuntu-latest
    steps:
      - name: GOOGLE_PLACES_API_KEY
        env:
          VALUE: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: test -n "$VALUE"

  smtp-secret:
    runs-on: ubuntu-latest
    steps:
      - name: FAHRDIENST_SMTP_PASSWORD
        env:
          VALUE: ${{ secrets.FAHRDIENST_SMTP_PASSWORD }}
        run: test -n "$VALUE"

  host-secret:
    runs-on: ubuntu-latest
    steps:
      - name: HETZNER_HOST
        env:
          VALUE: ${{ secrets.HETZNER_HOST }}
        run: test -n "$VALUE"

  ssh-secret:
    runs-on: ubuntu-latest
    steps:
      - name: HETZNER_SSH_PRIVATE_KEY
        env:
          VALUE: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: test -n "$VALUE"

  live-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check public website and API health
        run: |
          set -e
          curl -fsS --retry 3 https://tariq-fahrdienst.de/ >/dev/null
          curl -fsS --retry 3 https://tariq-fahrdienst.de/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"placesConfigured":true' /tmp/health.json
          grep -q '"mailConfigured":true' /tmp/health.json
