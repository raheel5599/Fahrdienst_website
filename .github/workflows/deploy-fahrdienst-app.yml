name: Fahrdienst-App auf Hetzner veröffentlichen
# Uses the existing server credential here without copying credentials to another repository.
# Shared proxy configuration is never written by this workflow.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-fahrdienst-app.yml']
  workflow_dispatch:
    inputs:
      app_ref:
        description: Fahrdienst-App commit or branch
        required: false
permissions:
  contents: read
concurrency:
  group: tariq-fahrdienst-app-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: raheel5599/fahrdienstapp
          ref: ${{ inputs.app_ref || '35a3529c5434346054ffde32fa99fe53c613c41c' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: App testen und bauen
        run: npm ci && npm test && npm run build
      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Fahrdienst veröffentlichen und VPN-Zugriff prüfen
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          set -euo pipefail
          check_vpn() {
            local response status attempt
            response=$(mktemp)
            for attempt in 1 2 3; do
              if status=$(curl --silent --show-error --max-time 15 --output "$response" --write-out '%{http_code}' https://app.tariq-fahrdienst.de/); then
                if [[ "$status" == 403 ]] && grep -Fq 'Nur über TARIQ VPN erreichbar' "$response"; then
                  rm -f "$response"
                  return 0
                fi
                echo "VPN-Prüfung, Versuch $attempt: HTTP $status, erwartete Sperrseite nicht bestätigt." >&2
                case "$status" in
                  2??|3??|403) break ;;
                esac
              else
                echo "VPN-Prüfung, Versuch $attempt: Verbindungsfehler (HTTP ${status:-000})." >&2
              fi
              if [[ "$attempt" != 3 ]]; then sleep 3; fi
            done
            rm -f "$response"
            return 1
          }
          check_vpn
          JS_ASSET=$(node -e 'const fs=require("fs");console.log(fs.readFileSync("dist/index.html","utf8").match(/src="([^"]+[.]js)"/)[1])')
          [[ "$JS_ASSET" =~ ^/assets/index-[A-Za-z0-9_-]+[.]js$ ]]
          JS_HASH=$(sha256sum "dist$JS_ASSET" | cut -d ' ' -f 1)
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/tariq-fahrdienst-app.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/tariq-fahrdienst-app.tar.gz "fpadmin@$SSH_HOST:/tmp/tariq-fahrdienst-app.tar.gz"
          tar -czf /tmp/tariq-fahrdienst-app-dist.tar.gz -C dist .
          scp -i ~/.ssh/deploy_key /tmp/tariq-fahrdienst-app-dist.tar.gz "fpadmin@$SSH_HOST:/tmp/tariq-fahrdienst-app-dist.tar.gz"
          ssh -i ~/.ssh/deploy_key "fpadmin@$SSH_HOST" "bash -s -- '$JS_ASSET' '$JS_HASH'" < scripts/deploy-hetzner.sh
          check_vpn
          echo 'VPN-Sperre von außen bestätigt.'
