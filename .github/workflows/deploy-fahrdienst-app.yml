name: Fahrdienst-App auf Hetzner veröffentlichen
# Uses the existing server credential here without copying credentials to another repository.
# Shared proxy configuration is never written by this workflow.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-fahrdienst-app.yml']
  workflow_dispatch:
    inputs:
      app_ref:
        description: Fahrdienst-App commit or branch
        required: true
        default: 'main'
permissions:
  contents: read
concurrency:
  group: tariq-fahrdienst-app-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: raheel5599/fahrdienstapp
          ref: ${{ inputs.app_ref || 'da71e5903e00b8adf6fc65004d9fba9e23d2f250' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: App testen und bauen
        run: npm ci && npm test && npm run build
      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: App veröffentlichen und HTTPS prüfen
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "fpadmin@${SSH_HOST}" 'python3 /opt/fahrschulpilot/deployment/hetzner/scripts/check-routes.py /opt/fahrschulpilot/deployment/hetzner/Caddyfile'
          JS_ASSET=$(node -e 'const fs=require("fs");console.log(fs.readFileSync("dist/index.html","utf8").match(/src="([^"]+[.]js)"/)[1])')
          if curl --fail --silent --show-error "https://app.tariq-fahrdienst.de${JS_ASSET}" -o /tmp/live-fahrdienst.js && cmp -s "dist${JS_ASSET}" /tmp/live-fahrdienst.js; then
            echo "Der getestete App-Stand ist bereits produktiv; HTTPS und Routing-Schutz sind geprüft."
            exit 0
          fi
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/tariq-fahrdienst-app.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/tariq-fahrdienst-app.tar.gz "fpadmin@${SSH_HOST}:/tmp/tariq-fahrdienst-app.tar.gz"
          ssh -i ~/.ssh/deploy_key "fpadmin@${SSH_HOST}" 'bash -s' < scripts/deploy-hetzner.sh
