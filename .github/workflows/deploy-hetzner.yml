name: Hetzner deploy
# deploy refresh 2026-09-29
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/deploy-fahrdienst-app.yml']
  workflow_dispatch:
concurrency:
  group: tariq-fahrdienst-site-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zentrale Anbindung testen
        run: node --test project-settings.test.mjs project-mail.test.mjs && node --check server.js && python3 -m py_compile deployment/merge-env.py
      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Website übertragen und starten
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          FAHRDIENST_SMTP_PASSWORD: ${{ secrets.FAHRDIENST_SMTP_PASSWORD }}
        run: |
          tar --exclude=.git -czf /tmp/site.tar.gz .
          {
            printf 'GOOGLE_PLACES_API_KEY=%s\n' "$GOOGLE_PLACES_API_KEY"
            printf 'SMTP_HOST=smtp.ionos.de\n'
            printf 'SMTP_PORT=465\n'
            printf 'SMTP_SECURE=true\n'
            printf 'SMTP_USER=info@taxi5599.de\n'
            printf 'SMTP_PASS=%s\n' "$FAHRDIENST_SMTP_PASSWORD"
            printf 'MAIL_TO=info@taxi5599.de\n'
          } > /tmp/tariq-fahrdienst.env
          chmod 600 /tmp/tariq-fahrdienst.env
          scp -i ~/.ssh/deploy_key /tmp/site.tar.gz "fpadmin@${SSH_HOST}:/tmp/tariq-fahrdienst-site.tar.gz"
          scp -i ~/.ssh/deploy_key /tmp/tariq-fahrdienst.env "fpadmin@${SSH_HOST}:/tmp/tariq-fahrdienst.env"
          ssh -i ~/.ssh/deploy_key "fpadmin@${SSH_HOST}" '
            set -e
            mkdir -p /home/fpadmin/sites/tariq-fahrdienst
            find /home/fpadmin/sites/tariq-fahrdienst -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +
            tar -xzf /tmp/tariq-fahrdienst-site.tar.gz -C /home/fpadmin/sites/tariq-fahrdienst
            python3 /home/fpadmin/sites/tariq-fahrdienst/deployment/merge-env.py /home/fpadmin/sites/tariq-fahrdienst/.env /tmp/tariq-fahrdienst.env
            chmod 600 /home/fpadmin/sites/tariq-fahrdienst/.env
            docker network inspect fahrschulpilot_web >/dev/null 2>&1 || docker network create fahrschulpilot_web
            cd /home/fpadmin/sites/tariq-fahrdienst
            docker compose -f compose.production.yml up -d --build website api
            docker ps --filter name=tariq-fahrdienst-site
          '
          # Shared Caddy routing is owned by fahrschulpilot; site deploys must not overwrite it.

      - name: Adresssuche Ende-zu-Ende prüfen
        run: node deployment/check-places.mjs https://tariq-fahrdienst.de
