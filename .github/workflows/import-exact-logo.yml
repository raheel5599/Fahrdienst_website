name: Import exact Fahrdienst logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-exact-logo.yml"

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved exact logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fahrdienst
          curl -fL --retry 3 --retry-delay 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/07d3f90b-f071-42e4-9519-f98cc3ac54a0.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmFlZjEwZjI0OWQ0ZDc5OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDgwNjUxNH0.vAma4AwOBGRGJhzspOZYdFZf907FZXWUqAtkGuFcB5A' -o assets/fahrdienst/logo-tariq-krankenfahrdienst.jpeg
          test -s assets/fahrdienst/logo-tariq-krankenfahrdienst.jpeg
          file assets/fahrdienst/logo-tariq-krankenfahrdienst.jpeg

      - name: Commit exact logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fahrdienst/logo-tariq-krankenfahrdienst.jpeg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Add exact TARIQ Krankenfahrdienst logo asset"
          git push
