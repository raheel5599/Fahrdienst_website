name: Import corrected Fahrdienst assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-corrected-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved corrected assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fahrdienst

          curl -fL --retry 3 --retry-delay 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/b7aa2dad-ac52-406f-8e98-84d54508f465.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDk4ZWIyMDNiYzQwZTBiNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDc2NTk1NX0.feQev3MA28ye3WR8HaXisKB_VkfVjgDWTVaBJWFZYAs' -o assets/fahrdienst/hero-vw-flotte-krankenhaus.png
          curl -fL --retry 3 --retry-delay 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/835891f6-37ec-49e7-a44e-41c77ba7e873.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDE5OWFmZjhjNzFkYWRjNSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDg0MDY5Nn0.8eCanxOwzIzNNOmixeqYVG7fPezTi_GlQ20wDZvuqr8' -o assets/fahrdienst/service-dialyse-rollstuhl-caddy.png
          curl -fL --retry 3 --retry-delay 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/4ffe7524-50e8-4023-886f-83b0b1128ec4.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzRmMTM4YjUwMmY1YjBmNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDg0NzAyOX0.uY5KRmbNRctIkYsRN4ElUMw1oNAiBk59PGtlIxXL2a8' -o assets/fahrdienst/ueber-uns-fahrer-patientin.png
          curl -fL --retry 3 --retry-delay 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/8a27cae8-1f58-45dc-bf2b-50c9339671e2.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDQ0YWYwNDk1YzhkMDAzZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDgyNjU2OX0.38rQOuAE3R_003rVkE0FnCbFCxy5ZBmvhAxgk2rpttM' -o assets/fahrdienst/service-arztfahrt-arteon.png
          curl -fL --retry 3 --retry-delay 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/0ea8e06c-0dff-4f93-8462-640aa04a60e5.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2ZmYzdlZmRjNjg4ZTYxZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDgwNDk4OX0.sA2JSeXva3CgJ3PbrCBu0ivdKH9Yd4Y_lpjDzdDHjYI' -o assets/fahrdienst/service-reha-caddy.png

          file assets/fahrdienst/hero-vw-flotte-krankenhaus.png
          file assets/fahrdienst/service-dialyse-rollstuhl-caddy.png
          file assets/fahrdienst/ueber-uns-fahrer-patientin.png
          file assets/fahrdienst/service-arztfahrt-arteon.png
          file assets/fahrdienst/service-reha-caddy.png

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fahrdienst
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "Replace Fahrdienst images with corrected vehicle branding"
          git push

# trigger corrected asset import
