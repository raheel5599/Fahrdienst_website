<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">TARIQ Krankenfahrdienst</title>
<desc id="desc">TARIQ Krankenfahrdienst Logo mit goldener Straßen-Sieben, weiß-goldenem TARIQ Schriftzug und Herzsymbol.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0a8"/>
    <stop offset=".22" stop-color="#f2bd45"/>
    <stop offset=".55" stop-color="#c98a1d"/>
    <stop offset=".8" stop-color="#f2bd45"/>
    <stop offset="1" stop-color="#fff0a8"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".55" stop-color="#f4f4f4"/>
    <stop offset="1" stop-color="#cfcfcf"/>
  </linearGradient>
</defs>

<!-- grosse Straßen-7 wie im Referenzlogo -->
<path d="M22 23H245L189 56H71Z" fill="url(#gold)" stroke="#111" stroke-width="4"/>
<path d="M219 28C156 65 99 132 49 252H111C149 153 185 94 252 48Z" fill="url(#gold)" stroke="#111" stroke-width="4"/>
<path d="M246 35C194 77 159 143 129 244H166C194 151 224 94 278 51Z" fill="url(#silver)" stroke="#111" stroke-width="4"/>
<path d="M207 70C177 108 154 157 136 220" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
<path d="M195 89C177 113 163 141 151 174" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="16 14" stroke-linecap="round"/>

<!-- TARIQ kompakt, ohne falsche Lücke -->
<text x="252" y="153" font-family="Arial Black,Arial,sans-serif" font-size="112" font-weight="900" fill="url(#silver)" stroke="#111" stroke-width="3">T</text>
<g transform="translate(335 61)">
  <path d="M58 0L0 92h36l24-39 26 39h37L63 0Z" fill="url(#silver)" stroke="#111" stroke-width="3"/>
  <path d="M16 72L56 9l18 26-38 57H0Z" fill="url(#gold)"/>
</g>
<text x="448" y="153" font-family="Arial Black,Arial,sans-serif" font-size="112" font-weight="900" fill="url(#silver)" stroke="#111" stroke-width="3">RIQ</text>

<!-- Herz mit Patientensymbol -->
<path d="M790 33C830-12 893 12 893 70c0 65-70 111-103 136-34-25-103-71-103-136 0-58 63-82 103-37Z" fill="#090909" stroke="url(#gold)" stroke-width="9"/>
<path d="M790 33C823-7 873 11 891 43" fill="none" stroke="#f5f5f5" stroke-width="7"/>
<circle cx="758" cy="87" r="14" fill="#f7f7f7"/>
<circle cx="809" cy="102" r="13" fill="#f7f7f7"/>
<path d="M730 113q42 23 86 52q-50 32-98 4z" fill="url(#gold)"/>
<path d="M756 106q15 32 52 36" fill="none" stroke="#f7f7f7" stroke-width="10" stroke-linecap="round"/>
<path d="M849 53v45M826 76h46" stroke="url(#gold)" stroke-width="11"/>

<!-- KRANKENFAHRDIENST -->
<line x1="235" y1="190" x2="302" y2="190" stroke="url(#gold)" stroke-width="6"/>
<text x="318" y="204" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" letter-spacing="2.2" fill="url(#gold)">KRANKENFAHRDIENST</text>
<line x1="782" y1="190" x2="848" y2="190" stroke="url(#gold)" stroke-width="6"/>

<!-- Slogan -->
<text x="285" y="249" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" letter-spacing="8" fill="#f3f3f3">WIR BRINGEN SIE SICHER ANS ZIEL.</text>
</svg>