services:
  website:
    build: .
    container_name: tariq-fahrdienst-site
    restart: unless-stopped
    networks:
      - web

  app:
    build:
      context: https://github.com/raheel5599/fahrdienstapp.git#main
    container_name: tariq-fahrdienst-app
    restart: unless-stopped
    networks:
      - web

  taxiapp:
    build:
      context: https://github.com/raheel5599/taxiapp.git#main
    container_name: tariq-taxi-app
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
    name: fahrschulpilot_web
